Options -MultiViews

RewriteEngine On

# =========================================================================
#  1. Canonical address: https://mirimodo.ro, without `www`
# =========================================================================
#
#  Without these rules the same page could be opened at four different
#  addresses (http/https x www/no www), and search engines treated them as
#  distinct pages competing with each other. The `canonical` tag in <head> is
#  only a hint; the 301 redirect is the only firm answer.
#
#  Order matters, twice over.
#
#  First, canonicalisation must run BEFORE the redirect to index.html,
#  otherwise the wrong address would serve the application and would never
#  reach the redirect at all.
#
#  Second, the trailing-slash rule comes first of the three. Every rule already
#  points at the full canonical address, so whichever matches first resolves
#  everything. With the slash rule last, `http://www.mirimodo.ro/servicii/` took
#  two hops (https first, then the slash); this way it takes a single one.

#  Trailing slash → no trailing slash: `/contact/` and `/contact` are the same
#  page. The root `/` is excluded (`.+`), and real directories on disk are left
#  alone so that `/gallery/` or `/.well-known/` do not break.
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.+)/$ https://mirimodo.ro/$1 [R=301,L]

#  www → no www.
RewriteCond %{HTTP_HOST} ^www\. [NC]
RewriteRule ^ https://mirimodo.ro%{REQUEST_URI} [R=301,L]

#  http → https. On shared hosting the request often arrives through a proxy,
#  so testing `%{HTTPS}` alone is not enough; the header set by the proxy is
#  checked as well, otherwise the rule either never fires or loops forever.
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
RewriteRule ^ https://mirimodo.ro%{REQUEST_URI} [R=301,L]

# =========================================================================
#  2. Single-page application
# =========================================================================
#
#  Real files and directories are served as they are; every other address gets
#  index.html, and React Router decides which page is shown.

RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

RewriteRule ^ index.html [L]
