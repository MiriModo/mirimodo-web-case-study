#  `-Indexes`: a folder without an index (for example `/gallery/`) answers 403
#  instead of listing its files. `-MultiViews`: Apache doesn't guess
#  `contact.html` for `/contact` on its own; the rewrite below does that
#  explicitly and predictably.
Options -MultiViews -Indexes

RewriteEngine On

# =========================================================================
#  1. Canonical address: https://mirimodo.ro, without `www`
# =========================================================================
#
#  Without these rules the same page could be opened at four different
#  addresses (http/https x www/no www), and search engines treated them as
#  separate pages competing with each other. The `canonical` tag in <head> is
#  only a hint; the 301 redirect is the only firm answer.
#
#  Order matters, twice.
#
#  First, canonicalisation has to run BEFORE the rewrite to `name.html`,
#  otherwise the wrong address would serve the page and never reach the
#  redirect.
#
#  Then, the trailing slash rules come first. Every rule already sends to the
#  full canonical address, so whichever matches first fixes everything. With
#  the slash rule at the end, `http://www.mirimodo.ro/servicii/` took two hops
#  (https first, then the slash); this way it takes one.

#  `/blog/` to `/blog` when the page `blog.html` exists, even though there is
#  also a `blog/` folder on disk (with the articles `blog/<slug>.html`). The
#  general rule below leaves folders alone, so without this one `/blog/` would
#  stay on the folder and answer 403.
RewriteCond %{DOCUMENT_ROOT}/$1.html -f
RewriteRule ^(.+)/$ https://mirimodo.ro/$1 [R=301,L]

#  Trailing slash to no trailing slash: `/contact/` and `/contact` are the same
#  page. The root `/` is excluded (`.+`), and real folders on disk are left
#  alone so `/gallery/` or `/.well-known/` don't break.
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.+)/$ https://mirimodo.ro/$1 [R=301,L]

#  www to no www.
RewriteCond %{HTTP_HOST} ^www\. [NC]
RewriteRule ^ https://mirimodo.ro%{REQUEST_URI} [R=301,L]

#  http to https. On shared hosting the request often comes through a proxy,
#  so checking only `%{HTTPS}` is not enough; the header set by the proxy is
#  checked too, otherwise the rule either never fires or loops.
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
RewriteRule ^ https://mirimodo.ro%{REQUEST_URI} [R=301,L]

# =========================================================================
#  2. Static pages generated by Astro
# =========================================================================
#
#  Every page exists on disk as `name.html`. The public address stays without
#  the extension (`/contact`) and the server serves it from `contact.html`.
#  Addresses that match no page get 404.html with a real 404 code, not the
#  home page, so search engines don't index ghost pages.

ErrorDocument 404 /404.html

#  `/contact.html` to `/contact`, so the page has a single address.
#  THE_REQUEST is the browser's original request, so this rule doesn't catch
#  the internal rewrite below and doesn't loop.
RewriteCond %{THE_REQUEST} \s/([^?\s]+)\.html[\s?]
RewriteCond %1 !^(index|404)$
RewriteRule ^ https://mirimodo.ro/%1 [R=301,L]

#  `/index` to `/`: the home page has a single address.
RewriteRule ^index$ https://mirimodo.ro/ [R=301,L]

#  The page `name.html` wins over the folder with the same name. This rule sits
#  BEFORE the one that leaves existing files and folders alone: for `/blog`
#  there is both `blog.html` and the `blog/` folder, and if the folder were
#  seen first, Apache (mod_dir) would redirect to `/blog/` and answer 403
#  instead of serving the blog page.
RewriteCond %{DOCUMENT_ROOT}/$1.html -f
RewriteRule ^(.+)$ $1.html [L]

#  Real files (assets, images, fonts) and folders are served as they are.
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# =========================================================================
#  3. Internal deploy files
# =========================================================================
#
#  `.deploy-manifest` is the list of published files (hash + size), written by
#  the deploy workflow so the next deploy knows what changed. It has no
#  business in the browser.
<Files ".deploy-manifest">
  <IfModule mod_authz_core.c>
    Require all denied
  </IfModule>
  <IfModule !mod_authz_core.c>
    Order allow,deny
    Deny from all
  </IfModule>
</Files>
