# Publishing the MIRIMODO site to ROMARG shared hosting, over explicit FTPS.
#
# Starts by itself on every push to `main`. The manual button in the Actions
# tab stays, for a redeploy without a new commit: see DEPLOYMENT.md.
#
# Only the contents of the `dist` folder are published. The project source
# never reaches the server.
name: Deploy productie (ROMARG)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The internal panel asks for an article dated today to go live right away:
  # the Supabase function `publica` sends this event.
  repository_dispatch:
    types: [publica-blog]
  # The blog: a build every morning, so scheduled articles show up on their
  # day. The minute is "odd" on purpose, the full hour is busy on GitHub.
  # Cron runs ONLY from the default branch (`main`); in a public repo it turns
  # itself off after 60 days without a commit.
  #
  # Times are in UTC, without the `timezone` key: on 26.10.2026 the cron with
  # `timezone: Europe/Bucharest` didn't start at all. Two runs, so one of them
  # always lands at 07:07 Romanian time (05:07 UTC in winter, 04:07 UTC in
  # summer) and a run skipped by GitHub gets caught by the other one. The extra
  # run just republishes the same content.
  schedule:
    - cron: '7 4 * * *'
    - cron: '7 5 * * *'

# The workflow only reads the repository. It never writes anything back to Git.
permissions:
  contents: read

# Two deploys at the same time would overwrite the same files on the server.
# `cancel-in-progress: false` is on purpose: a deploy stopped halfway would
# leave the site mixed, with new assets and an old `index.html`.
concurrency:
  group: deploy-productie
  cancel-in-progress: false

jobs:
  deploy:
    name: Build si publicare
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descarca sursa
        uses: actions/checkout@v6

      - name: Pregateste Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instaleaza dependentele
        run: npm ci

      - name: Verificare de tipuri
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # No old build is allowed to mix with the new one.
      - name: Sterge build-ul anterior
        run: rm -rf dist

      # The VITE_* variables are given ONLY here. Vite bakes them into the
      # bundle, so anything put here becomes public: only anon keys, never
      # service or admin keys.
      - name: Build de productie
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build

      - name: Valideaza build-ul
        run: |
          set -euo pipefail

          obligatorii=(
            dist/index.html
            dist/.htaccess
            dist/robots.txt
            dist/sitemap.xml
            dist/rss.xml
            dist/blog.html
            dist/brand/favicon.svg
            dist/brand/favicon.png
          )
          for fisier in "${obligatorii[@]}"; do
            if [ ! -f "$fisier" ]; then
              echo "Lipseste din build: $fisier"
              exit 1
            fi
          done

          if [ ! -d dist/assets ] || [ -z "$(ls -A dist/assets)" ]; then
            echo "dist/assets lipseste sau este gol"
            exit 1
          fi

          # Nothing from the source and no secret is allowed in what gets published.
          interzise=(
            dist/.env
            dist/src
            dist/scripts
            dist/materiale
            dist/package.json
            dist/package-lock.json
            dist/vite.config.ts
            dist/tsconfig.json
          )
          for cale in "${interzise[@]}"; do
            if [ -e "$cale" ]; then
              echo "Nu are ce cauta in build: $cale"
              exit 1
            fi
          done

          if find dist \( -name '*.map' -o -name '.env*' \) | grep -q .; then
            echo "Build-ul contine fisiere .map sau .env"
            exit 1
          fi

          echo "Build valid: $(find dist -type f | wc -l) fisiere, $(du -sh dist | cut -f1)"

      - name: Instaleaza lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      # TEMPORARY DIAGNOSTIC STEP.
      #
      # Checks the FTPS handshake and the server certificate without uploading
      # anything. To be removed once the first deploy works.
      #
      # It doesn't print the user, the password or the server contents. Values
      # coming from secrets are masked by GitHub in the log anyway.
      - name: Diagnostic FTPS, fara upload
        env:
          FTP_HOST: ${{ secrets.ROMARG_FTP_HOST }}
          FTP_PORT: ${{ secrets.ROMARG_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.ROMARG_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.ROMARG_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          echo "== 0. Portul din secret =="
          if [ "$FTP_PORT" = "21" ]; then
            echo "Portul este 21, deci FTPS explicit (AUTH TLS pe conexiunea de control)."
          else
            echo "ATENTIE: portul din secret nu este 21."
            echo "Pe 990 ar fi FTPS implicit, care cere alta configurare."
            exit 1
          fi
          echo

          # `-starttls ftp` sends the AUTH TLS command, which is exactly how
          # explicit FTPS works. No user and no password are sent in this step:
          # the handshake is tested on its own, before authentication.
          echo "== 1. Handshake TLS, inainte de orice autentificare =="
          raspuns="$(openssl s_client -connect "$FTP_HOST:$FTP_PORT" -starttls ftp \
            -servername "$FTP_HOST" -verify_hostname "$FTP_HOST" \
            </dev/null 2>&1 || true)"

          printf '%s\n' "$raspuns" | grep -E '^(depth=|verify |Verify return code)' || true
          echo

          echo "== 2. Certificatul prezentat de server =="
          printf '%s\n' "$raspuns" | openssl x509 -noout -subject -issuer -startdate -enddate \
            || { echo "Handshake TLS esuat: serverul nu a prezentat un certificat lizibil."; exit 1; }
          echo
          echo "Nume acoperite de certificat:"
          printf '%s\n' "$raspuns" | openssl x509 -noout -ext subjectAltName || true
          echo

          # Same settings as the real deploy. It only lists the root, it
          # doesn't upload anything. The output goes to /dev/null so the server
          # contents don't end up in the log.
          echo "== 3. Sesiune lftp completa, cu setarile de la publicare =="
          lftp -u "$FTP_USERNAME" --env-password -p "$FTP_PORT" "ftp://$FTP_HOST" -e "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ftp:ssl-protect-list true;
          set ssl:verify-certificate true;
          set ssl:check-hostname true;
          set ftp:passive-mode true;
          set net:max-retries 1;
          set net:timeout 20;
          set cmd:fail-exit true;
          cls -1 -d /;
          bye
          " > /dev/null
          echo "Conexiune FTPS stabilita, autentificare reusita, radacina accesibila."

      # Explicit FTPS, meaning AUTH TLS on port 21, passive mode, with
      # certificate verification on. The password reaches lftp through the
      # LFTP_PASSWORD environment variable, so it never shows up in the command
      # line.
      #
      # The FTP account already has `public_html` as its root, that's why the
      # target is `/` and not `/public_html`.
      #
      # `--ignore-time` compares by size, not by date: files regenerated on
      # every build always have a new date, and otherwise all ~112 MB would be
      # uploaded again every time.
      #
      # The side effect: a file that changed but kept the same size (a price
      # fix "1.290 €" to "1.390 €" in an article) would never be uploaded. So
      # every deploy leaves a manifest on the server (`.deploy-manifest`: hash,
      # size, path for every file), and the next deploy compares it with the new
      # build and explicitly uploads the files with a different hash and the
      # same size, the ones mirror would skip. The manifest is blocked in
      # `.htaccess`, it can't be opened in the browser.
      #
      # `index.html` is excluded from the mirror and uploaded last, after the
      # assets, so there is never a moment when the page asks for files that
      # haven't arrived yet.
      - name: Publica prin FTPS explicit
        env:
          FTP_HOST: ${{ secrets.ROMARG_FTP_HOST }}
          FTP_PORT: ${{ secrets.ROMARG_FTP_PORT }}
          FTP_USERNAME: ${{ secrets.ROMARG_FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.ROMARG_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          MIRROR_EXCLUDES="--exclude '^index\.html' --exclude '^\.htaccess' --exclude '^robots\.txt' --exclude '^sitemap\.xml' --exclude '^rss\.xml' --exclude '^\.deploy-manifest' --exclude '^cgi-bin/' --exclude '^\.well-known/' --exclude '^\.ftpquota'"

          LFTP_SETARI="
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ftp:ssl-protect-list true;
          set ssl:verify-certificate true;
          set ssl:check-hostname true;
          set ftp:passive-mode true;
          set net:max-retries 3;
          set net:timeout 20;
          set xfer:clobber on;"

          # 1. Manifest of the current build: hash, size, path (tab separated),
          #    one line for every file in dist.
          (
            cd dist
            find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r fisier; do
              printf '%s\t%s\t%s\n' \
                "$(sha256sum -- "$fisier" | cut -d' ' -f1)" \
                "$(stat -c %s -- "$fisier")" \
                "$fisier"
            done
          ) > manifest-nou.tsv
          echo "Manifest nou: $(wc -l < manifest-nou.tsv) fisiere"

          # 2. Manifest of the previous deploy, from the server. It's missing on
          #    the first deploy with a manifest; then lftp reports an error and
          #    the local file stays empty or doesn't exist.
          lftp -u "$FTP_USERNAME" --env-password -p "$FTP_PORT" "ftp://$FTP_HOST" -e "
          $LFTP_SETARI
          set cmd:fail-exit false;
          get /.deploy-manifest -o manifest-vechi.tsv;
          bye
          " || true
          [ -f manifest-vechi.tsv ] || : > manifest-vechi.tsv

          # 3. The fixes: files present in both manifests, with a different
          #    hash and the same size. Everything else (new files, changed size,
          #    deleted files) is handled by mirror. Without an old manifest
          #    there's no way to know what changed, so all text files get
          #    uploaded once, since they're the only ones where a same size edit
          #    is likely.
          if [ -s manifest-vechi.tsv ]; then
            awk -F'\t' '
              NR == FNR { hash[$3] = $1; marime[$3] = $2; next }
              ($3 in hash) && hash[$3] != $1 && marime[$3] == $2 { print $3 }
            ' manifest-vechi.tsv manifest-nou.tsv > corecturi.txt
          else
            echo "Pe server nu exista inca .deploy-manifest: se reincarca toate fisierele text."
            cut -f3 manifest-nou.tsv | grep -E '\.(html|xml|txt|css|js|mjs|json|svg|webmanifest)$' > corecturi.txt || true
          fi

          # The files below get uploaded explicitly anyway, at the end.
          grep -vxE 'index\.html|\.htaccess|robots\.txt|sitemap\.xml|rss\.xml' corecturi.txt > corecturi-filtrate.txt || true

          : > corecturi.lftp
          while IFS= read -r cale; do
            printf 'put "dist/%s" -o "/%s";\n' "$cale" "$cale" >> corecturi.lftp
          done < corecturi-filtrate.txt
          echo "Fisiere urcate explicit (aceeasi dimensiune, continut nou): $(wc -l < corecturi-filtrate.txt)"
          head -50 corecturi-filtrate.txt

          # 4. The actual deploy: mirror, then the fixes (the folders exist
          #    after mirror), then the root files, then the manifest.
          lftp -u "$FTP_USERNAME" --env-password -p "$FTP_PORT" "ftp://$FTP_HOST" -e "
          $LFTP_SETARI
          set cmd:fail-exit true;
          mirror --reverse --delete --ignore-time --no-perms --parallel=4 --verbose $MIRROR_EXCLUDES dist/ /;
          source corecturi.lftp;
          put dist/.htaccess -o /.htaccess;
          put dist/robots.txt -o /robots.txt;
          put dist/sitemap.xml -o /sitemap.xml;
          put dist/rss.xml -o /rss.xml;
          put dist/index.html -o /index.html;
          put manifest-nou.tsv -o /.deploy-manifest;
          bye
          "

      # "Realizat" articles whose day has come are now on the site: their state
      # becomes "publicat", so the panel shows the truth. The service key lives
      # only here, in the GitHub secrets, never in the site.
      - name: Marcheaza articolele publicate
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_KEY:-}" ]; then
            echo "Secretul SUPABASE_SERVICE_ROLE_KEY lipseste: starea articolelor nu se actualizeaza."
            exit 0
          fi
          azi="$(TZ=Europe/Bucharest date +%F)"
          curl -sS -f -X PATCH \
            "$SUPABASE_URL/rest/v1/articole?stare=eq.realizat&data_publicare=lte.$azi" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"stare":"publicat"}'
          echo "Articolele cu data pana la $azi sunt marcate publicate."

      - name: Rezumat
        run: |
          echo "Publicat din commit ${GITHUB_SHA:0:7}, ramura ${GITHUB_REF_NAME}."
          echo "Verifica https://mirimodo.ro cu reincarcare fortata (Ctrl+Shift+R)."
